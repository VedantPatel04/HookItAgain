# lint, tests, alembic on CI postgres, web build, and cdk synth on every push and PR.
# no migrate against Supabase. no cdk deploy (OIDC is the next slice).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: ruff and pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookitagain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookitagain
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hookitagain
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_SECRET: ci-test-secret
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install "ruff>=0.8,<1" pytest
      - run: ruff check src
      - run: pytest tests -q

  web:
    name: web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: infra tests and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/unit -q
      - run: npx --yes cdk synth -c stage=dev
