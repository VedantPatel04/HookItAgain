# lint, unit tests, and cdk synth on every push and PR.
# no migrate (needs Supabase). no deploy (needs AWS secrets and the Lambda quota).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install "ruff>=0.8,<1"
      - run: ruff check src

  web:
    name: web lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  infra:
    name: infra tests and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/unit -q
      - run: npx --yes cdk synth -c stage=dev
